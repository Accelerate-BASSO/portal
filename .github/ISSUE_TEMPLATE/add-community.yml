name: Add a community
description: Submit a community forum or group to be listed on the portal
title: "[Community] "
labels: ["new-resource", "community"]
body:
  - type: input
    id: name
    attributes:
      label: Community name
      placeholder: e.g. APRICOT Community of Practice
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A brief description (1-3 sentences)
      placeholder: What is this community about and who is it for?
    validations:
      required: true

  - type: checkboxes
    id: projects
    attributes:
      label: Project(s)
      description: Which project(s) is this community associated with?
      options:
        - label: APRICOT
        - label: BSO-AD
        - label: ODFA
        - label: PHASES
        - label: DCC

  - type: input
    id: url
    attributes:
      label: Community URL
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Discourse
        - Website
        - Other
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
