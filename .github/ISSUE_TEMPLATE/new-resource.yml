name: Add a new resource
description: Submit a resource to be listed on the Accelerate BASSO Portal
title: "[Resource] "
labels: ["new-resource"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a resource to the portal! Please fill out the details below.
        All fields marked with * are required.

  - type: input
    id: name
    attributes:
      label: Resource name
      description: The display name for this resource
      placeholder: e.g. Behaviour Change Intervention Ontology (BCIO)
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Resource type
      options:
        - Ontology
        - Publication
        - Repository
        - Website
        - Registry
        - Community
        - Tool
        - Dataset
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A brief description of the resource (1-3 sentences)
      placeholder: What is this resource and why is it useful?
    validations:
      required: true

  - type: checkboxes
    id: developed-by
    attributes:
      label: Developed by (projects)
      description: Which project(s) develop or maintain this resource?
      options:
        - label: APRICOT
        - label: BSO-AD
        - label: ODFA
        - label: PHASES
        - label: DCC

  - type: checkboxes
    id: used-by
    attributes:
      label: Used by (projects)
      description: Which project(s) use this resource?
      options:
        - label: APRICOT
        - label: BSO-AD
        - label: ODFA
        - label: PHASES
        - label: DCC

  - type: textarea
    id: links
    attributes:
      label: Links
      description: |
        Where does this resource live? List one link per line in the format: Platform - URL
        Supported platforms: GitHub, BioPortal, OLS, Ontobee, Zenodo, OSF, Website, Discourse, Other
      placeholder: |
        GitHub - https://github.com/example/repo
        BioPortal - https://bioportal.bioontology.org/ontologies/EXAMPLE
    validations:
      required: true

  - type: dropdown
    id: bsso-foundry
    attributes:
      label: BSSO Foundry member?
      description: Is this ontology a member of the BSSO Foundry? (Only applicable to ontologies)
      options:
        - "Not applicable"
        - "Yes"
        - "No"

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Active
        - In Development
        - Archived
    validations:
      required: true

  - type: input
    id: published-date
    attributes:
      label: Published date
      description: For publications only. Format YYYY-MM (e.g. 2025-03)
      placeholder: "2025-03"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else we should know about this resource?
