name: Add a tool, registry, or dataset
description: Submit a tool, standards registry, or dataset to be listed on the portal
title: "[Resource] "
labels: ["resource: new"]
body:
  - type: input
    id: name
    attributes:
      label: Resource name
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Resource type
      options:
        - Tool
        - Registry
        - Dataset
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A brief description (1-3 sentences)
      placeholder: What is this resource and why is it useful?
    validations:
      required: true

  - type: checkboxes
    id: projects
    attributes:
      label: Project(s)
      description: Which project(s) is this resource associated with?
      options:
        - label: APRICOT
        - label: BSO-AD
        - label: ODFA
        - label: PHASES
        - label: DCC

  - type: input
    id: url
    attributes:
      label: URL
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Active
        - In Development
        - Archived
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
