name: Add a repository
description: Submit a code or data repository to be listed on the portal
title: "[Repository] "
labels: ["resource: new", "resource: repository"]
body:
  - type: input
    id: name
    attributes:
      label: Repository name
      placeholder: e.g. PHASES GitHub Repository
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A brief description (1-3 sentences)
      placeholder: What does this repository contain?
    validations:
      required: true

  - type: checkboxes
    id: projects
    attributes:
      label: Project(s)
      description: Which project(s) is this repository associated with?
      options:
        - label: APRICOT
        - label: BSO-AD
        - label: ODFA
        - label: PHASES
        - label: DCC

  - type: input
    id: url
    attributes:
      label: Repository URL
      placeholder: https://github.com/org/repo
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - GitHub
        - OSF
        - Zenodo
        - Other
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Active
        - In Development
        - Archived
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
