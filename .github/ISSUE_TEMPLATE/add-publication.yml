name: Add a publication
description: Submit a publication to be listed on the portal
title: "[Publication] "
labels: ["new-resource", "publication"]
body:
  - type: input
    id: name
    attributes:
      label: Publication title
      placeholder: e.g. Ontologies in the Behavioral Sciences
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A brief description (1-3 sentences). Include the journal/venue if applicable.
      placeholder: What is this publication about and where was it published?
    validations:
      required: true

  - type: input
    id: published-date
    attributes:
      label: Published date
      description: Format YYYY-MM
      placeholder: "2025-03"
    validations:
      required: true

  - type: checkboxes
    id: projects
    attributes:
      label: Project(s)
      description: Which project(s) produced this publication?
      options:
        - label: APRICOT
        - label: BSO-AD
        - label: ODFA
        - label: PHASES
        - label: DCC

  - type: input
    id: doi
    attributes:
      label: DOI URL
      placeholder: https://doi.org/10.1234/example

  - type: input
    id: pubmed
    attributes:
      label: PubMed URL
      placeholder: https://pubmed.ncbi.nlm.nih.gov/12345678/

  - type: input
    id: other-link
    attributes:
      label: Other link
      description: Any other URL where this publication can be accessed
      placeholder: https://example.com/paper.pdf

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
