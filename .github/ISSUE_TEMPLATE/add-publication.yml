name: Add a publication
description: Submit a publication to be listed on the portal
title: "[Publication] "
labels: ["resource: new", "resource: publication"]
body:
  - type: markdown
    attributes:
      value: |
        Provide **one** of the following and we'll extract the details automatically:
        - A **PubMed URL** or PMID (easiest)
        - A **DOI** URL
        - A **BibTeX** entry

        You can also fill in fields manually if needed.

  - type: input
    id: pubmed
    attributes:
      label: PubMed URL or PMID
      description: We'll pull title, journal, date, DOI, and abstract from PubMed automatically.
      placeholder: https://pubmed.ncbi.nlm.nih.gov/12345678/ or just 12345678

  - type: input
    id: doi
    attributes:
      label: DOI
      description: If not in PubMed, provide a DOI and we'll pull metadata from CrossRef.
      placeholder: https://doi.org/10.1234/example or 10.1234/example

  - type: textarea
    id: bibtex
    attributes:
      label: BibTeX entry
      description: Alternatively, paste a BibTeX entry.
      placeholder: |
        @article{smith2025example,
          title={An Example Paper Title},
          author={Smith, Jane and Doe, John},
          journal={Journal of Examples},
          year={2025},
          month={3},
          doi={10.1234/example.2025}
        }
      render: bibtex

  - type: checkboxes
    id: projects
    attributes:
      label: Project(s)
      description: Which project(s) produced this publication?
      options:
        - label: APRICOT
        - label: BSO-AD
        - label: ODFA
        - label: PHASES
        - label: DCC
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description (optional)
      description: Override the auto-generated description if needed (1-3 sentences).
      placeholder: What is this publication about?

  - type: input
    id: published-year
    attributes:
      label: Published year (optional)
      description: Override if the auto-detected year is wrong.
      placeholder: "2025"

  - type: input
    id: published-month
    attributes:
      label: Published month (optional)
      description: Numeric month (1-12). Override if needed.
      placeholder: "3"

  - type: input
    id: other-link
    attributes:
      label: Other link
      description: Any other URL where this publication can be accessed
      placeholder: https://example.com/paper.pdf

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
