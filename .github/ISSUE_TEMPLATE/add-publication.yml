name: Add a publication
description: Submit a publication to be listed on the portal
title: "[Publication] "
labels: ["resource: new", "resource: publication"]
body:
  - type: markdown
    attributes:
      value: |
        Paste a link or identifier and we'll extract the details automatically. Supported sources:
        - **PubMed** URL or PMID
        - **PMC** URL
        - **DOI** URL or string
        - **arXiv** URL or ID
        - **PsyArXiv / SocArXiv / OSF Preprints** URL
        - **BibTeX** entry

        You can leave the title above as-is — it will be updated automatically with the publication name.

  - type: textarea
    id: source
    attributes:
      label: Publication source
      description: Paste a URL, ID, or BibTeX entry. We'll detect the source automatically.
      placeholder: |
        Examples:
          https://pubmed.ncbi.nlm.nih.gov/12345678/
          https://doi.org/10.1234/example
          https://arxiv.org/abs/2301.12345
          https://psyarxiv.com/abc12
          12345678
          10.1234/example
          @article{...}
    validations:
      required: true

  - type: checkboxes
    id: projects
    attributes:
      label: Project(s)
      description: Which project(s) produced this publication?
      options:
        - label: APRICOT
        - label: BSO-AD
        - label: ODFA
        - label: PHASES
        - label: DCC
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description (optional)
      description: Override the auto-generated description if needed.
      placeholder: What is this publication about?

  - type: input
    id: published-year
    attributes:
      label: Published year (optional)
      description: Override if the auto-detected year is wrong.
      placeholder: "2025"

  - type: input
    id: published-month
    attributes:
      label: Published month (optional)
      description: Numeric month (1-12). Override if needed.
      placeholder: "3"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
