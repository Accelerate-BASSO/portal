name: Generate publication from issue

on:
  issues:
    types: [opened]

jobs:
  generate-publication:
    if: contains(github.event.issue.labels.*.name, 'publication')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install bibtexparser pyyaml

      - name: Extract resource ID from issue
        id: resource-id
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Extract a slug from the issue title for the branch and filename
          SLUG=$(echo "${{ github.event.issue.title }}" | \
            sed 's/\[Publication\]//g' | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[^a-z0-9]/-/g' | \
            sed 's/--*/-/g' | \
            sed 's/^-//' | \
            sed 's/-$//' | \
            cut -c1-50)
          if [ -z "$SLUG" ]; then
            SLUG="publication-${{ github.event.issue.number }}"
          fi
          echo "slug=pub-${SLUG}" >> "$GITHUB_OUTPUT"
          echo "branch=add-pub-${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Generate YAML from issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          OUTPUT="data/resources/${{ steps.resource-id.outputs.slug }}.yaml"
          python scripts/parse-publication-issue.py \
            --issue-body "$ISSUE_BODY" \
            --output "$OUTPUT"
          echo "## Generated YAML" >> "$GITHUB_STEP_SUMMARY"
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          cat "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.resource-id.outputs.branch }}"
          SLUG="${{ steps.resource-id.outputs.slug }}"
          ISSUE_NUM="${{ github.event.issue.number }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          OUTPUT="data/resources/${SLUG}.yaml"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add "$OUTPUT"
          git commit -m "Add publication: ${SLUG}

          Generated from issue #${ISSUE_NUM}"

          git push origin "$BRANCH"

          gh pr create \
            --title "Add publication from issue #${ISSUE_NUM}" \
            --body "$(cat <<EOF
          ## Auto-generated from issue #${ISSUE_NUM}

          **Issue:** ${ISSUE_TITLE}

          This PR was automatically generated from a publication issue submission. Please review the generated YAML below before merging.

          ### Generated file: \`${OUTPUT}\`

          \`\`\`yaml
          $(cat "$OUTPUT")
          \`\`\`

          ---
          Closes #${ISSUE_NUM}
          EOF
          )" \
            --base main \
            --head "$BRANCH"

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          SLUG="${{ steps.resource-id.outputs.slug }}"
          gh issue comment "$ISSUE_NUM" \
            --body "A pull request has been created to add this publication to the portal. A maintainer will review and merge it shortly."
