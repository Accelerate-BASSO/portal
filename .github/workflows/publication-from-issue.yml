name: Generate publication from issue

on:
  issues:
    types: [opened]

jobs:
  generate-publication:
    if: "contains(github.event.issue.labels.*.name, 'resource: publication')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install bibtexparser pyyaml

      - name: Generate YAML from issue
        id: generate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          # Use issue number for a predictable, collision-free name
          TEMP_OUTPUT="data/resources/pub-issue-${ISSUE_NUM}.yaml"
          python scripts/parse-publication-issue.py \
            --issue-body "$ISSUE_BODY" \
            --output "$TEMP_OUTPUT" \
            --summary /tmp/summary.md

          # Extract the generated resource ID from the YAML for a better filename
          RESOURCE_ID=$(grep '^id:' "$TEMP_OUTPUT" | head -1 | sed 's/^id: *//')
          if [ -n "$RESOURCE_ID" ] && [ "$RESOURCE_ID" != "pub-issue-${ISSUE_NUM}" ]; then
            FINAL_OUTPUT="data/resources/${RESOURCE_ID}.yaml"
            mv "$TEMP_OUTPUT" "$FINAL_OUTPUT"
          else
            RESOURCE_ID="pub-issue-${ISSUE_NUM}"
            FINAL_OUTPUT="$TEMP_OUTPUT"
          fi

          echo "output=${FINAL_OUTPUT}" >> "$GITHUB_OUTPUT"
          echo "resource-id=${RESOURCE_ID}" >> "$GITHUB_OUTPUT"
          echo "branch=add-pub-issue-${ISSUE_NUM}" >> "$GITHUB_OUTPUT"

          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.generate.outputs.branch }}"
          RESOURCE_ID="${{ steps.generate.outputs.resource-id }}"
          ISSUE_NUM="${{ github.event.issue.number }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          OUTPUT="${{ steps.generate.outputs.output }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete remote branch if it exists from a previous failed run
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git add "$OUTPUT"
          git commit -m "Add publication: ${RESOURCE_ID}

          Generated from issue #${ISSUE_NUM}"

          git push origin "$BRANCH"

          gh pr create \
            --title "Add publication: ${RESOURCE_ID}" \
            --body-file <(cat <<EOF
          ## Auto-generated from issue #${ISSUE_NUM}

          **Issue:** ${ISSUE_TITLE}

          This PR was automatically generated from a publication issue submission. Please review the generated YAML below before merging.

          ### Generated file: \`${OUTPUT}\`

          \`\`\`yaml
          $(cat "$OUTPUT")
          \`\`\`

          ---
          Closes #${ISSUE_NUM}
          EOF
          ) \
            --base main \
            --head "$BRANCH"

      - name: Comment on issue with extracted fields
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          {
            echo "A pull request has been created to add this publication to the portal. A maintainer will review and merge it shortly."
            echo ""
            cat /tmp/summary.md
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUM" --body-file /tmp/comment.md
