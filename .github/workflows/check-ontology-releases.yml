name: Check for ontology updates

on:
  schedule:
    - cron: "0 8 * * *"  # Daily at 8am UTC
  workflow_dispatch:

jobs:
  check-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch current BioPortal metrics
        env:
          BIOPORTAL_API_KEY: ${{ secrets.BIOPORTAL_API_KEY }}
        run: python scripts/fetch-bioportal-metrics.py

      - name: Check for release changes
        id: check
        run: |
          python scripts/check-ontology-updates.py \
            --previous data/bioportal-baseline.json \
            --current data/bioportal-cache.json \
            --output-dir /tmp/updates

      - name: Record updates as closed issues
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACRONYMS: ${{ steps.check.outputs.acronyms }}
        run: |
          for acronym in $ACRONYMS; do
            ontology_label="ontology:$acronym"
            gh label create "$ontology_label" --color 1F6FEB --description "Relates to the $acronym ontology" --force >/dev/null
            issue_url=$(gh issue create \
              --title "Ontology update detected: $acronym — $(date +%Y-%m-%d)" \
              --body-file "/tmp/updates/$acronym.md" \
              --label "ontology-update" \
              --label "$ontology_label")
            gh issue close "$issue_url" --reason completed --comment "Baseline updated automatically; recording this release for the changelog."
          done

      - name: Update baseline
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp data/bioportal-cache.json data/bioportal-baseline.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bioportal-baseline.json
          git commit -m "Update BioPortal baseline after release detection"
          git push
