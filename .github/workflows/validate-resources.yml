name: Validate resources

on:
  push:
    paths:
      - "data/resources/**"
      - "scripts/validate-resources.py"
      - ".github/workflows/validate-resources.yml"
  pull_request:
    paths:
      - "data/resources/**"
      - "scripts/validate-resources.py"
      - ".github/workflows/validate-resources.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate resource files
        run: python scripts/validate-resources.py
