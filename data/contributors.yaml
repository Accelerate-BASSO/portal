# Known network contributors.
# One entry per person. List every spelling a person's name may take in
# publication metadata (PubMed, CrossRef, etc.) under `names`; the first name
# is treated as canonical.
#
# `orcid` is optional. The pub-to-yaml.py and resolve-orcids.py scripts use
# this file to resolve ORCIDs for authors by matching names, so a person with
# an ORCID lets those scripts fill it in automatically. People without an ORCID
# can still be listed here for completeness; they are simply skipped during
# ORCID resolution.

