id: pub-pmid32164773
name: >-
  The effectiveness of a comprehensive corrective exercises program and
  subsequent detraining on alignment, muscle activation, and movement pattern
  in men with upper crossed syndrome: protocol for a parallel-group randomized
  controlled trial.
type: Publication
publishedYear: 2020
publishedMonth: 3
description: >-
  Upper crossed syndrome (UCS) refers to specific altered muscle activation
  and changed movement patterns along with some postural deviations in the
  upper quarter of the body. This syndrome might contribute to the dysfunction
  of the cervicothoracic and glenohumeral joints.
