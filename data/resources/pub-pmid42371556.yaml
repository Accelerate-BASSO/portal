name: Towards Healthy Aging through Semantic Enrichment.
type: Publication
publishedYear: 2025
doi: "https://doi.org/10.1093/geronb/gby037"
pmid: 42371556
venue: CEUR workshop proceedings.
description: >-
  This paper introduces two interoperable ontologies-SOLO (Solitude Ontology)
  and GERO (Gerotranscendence Ontology)-developed to formalize key
  psychological constructs relevant to healthy aging. Grounded in the
  Behavioral Change Intervention Ontology, the ontologies clarify distinctions
  between terms such as solitude, loneliness, self-transcendence, and
  gerotranscendence, and encode their realization conditions across the
  lifespan. By integrating validated psychometric instruments and supporting
  structured responses to competency questions, the ontologies enable semantic
  reasoning, cross-disciplinary data integration, and development of
  ontology-driven tools for aging research and intervention design.
