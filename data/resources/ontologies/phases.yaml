id: phases
name: Promoting Healthy Aging through Semantic Enrichment of Solitude Research Ontology (PHASES)
type: Ontology
description: >-
  An ontology for integrating research in solitude and gerotranscendence,
  developed to deepen understanding of each and of how they promote healthy
  aging. It formalizes psychological constructs such as solitude, loneliness,
  and gerotranscendence and the distinctions between them.
