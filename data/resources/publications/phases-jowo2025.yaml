id: pub-phases-jowo2025
name: "Towards Healthy Aging through Semantic Enrichment"
type: Publication
publishedYear: 2025
pmid: 42371556
venue: Proceedings of the Joint Ontology Workshops (JOWO) 2025 - PHASES Workshop (CEUR Workshop Proceedings, Vol 4176)
description: >-
  Describes the PHASES (Promoting Healthy Aging through Semantic Enrichment
  of Solitude Research) project's approach to using ontologies and knowledge
  graphs to enrich social science research on solitude, gerotranscendence,
  and narrative identity for healthy aging research. Presented at the PHASES
  Workshop at JOWO 2025, co-located with FOIS 2025.
