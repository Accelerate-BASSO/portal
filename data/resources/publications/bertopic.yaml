id: pub-phases-bertopic
name: Utilizing BERTopic Modeling for Concept Discovery in the Domain of Gerotranscendence and Solitude.
type: Publication
publishedYear: 2025
publishedMonth: 9
doi: "https://doi.org/10.21203/rs.3.rs-7383440/v1"
pmid: 41001555
venue: Research square
description: >-
  Ontology development is a complex, iterative process that traditionally
  requires extensive collaboration between ontology developers and subject
  matter experts (SMEs). While effective, this manual approach is
  time-consuming, labor-intensive, and prone to cognitive bias. To streamline
  early-stage ontology development and uncover concepts that might be
  overlooked through manual review alone, we applied automated topic modeling
  with BERTopic to extract topics, keywords, topic labels, and summaries from
  The Handbook of Solitude: Psychological Perspectives on Social Isolation,
  Social Withdrawal, and Being Alone and Gerotranscendence: A Developmental
  Theory of Positive Aging. The extracted topic labels were used as candidate
  concepts for the Promoting Healthy Aging through Semantic Enrichment of
  Solitude Research (PHASES) Ontology.
