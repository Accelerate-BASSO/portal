# Accelerate BASSO network members.
# One entry per person. List every spelling a person's name may take in
# publication metadata (PubMed, CrossRef, etc.) under `names`; the first name
# is treated as canonical.
#
# `orcid` is optional. The pub-to-yaml.py and resolve-orcids.py scripts use this
# file to resolve ORCIDs for authors by matching names. People without an ORCID
# are still listed for completeness and are skipped during ORCID resolution.
# ORCIDs that could not be confidently verified are left off.
#
# `ror` is an optional Research Organization Registry ID for the member's
# current primary institution (https://ror.org/<id>), with the institution name
# as an inline comment. Not consumed by the scripts.
#
# `homepage` and `linkedin` are optional URLs for the member's personal or
# institutional homepage and LinkedIn profile. Populated opportunistically.
#
# `projects` is an optional list of the member's roles, one per project. Each
# item is {id, role}. A member may appear on several projects with different
# roles. `role` may be omitted when the role is not yet known.
#   project ids: BSO-AD, APRICOT, ODFA, PHASES, DCC
#   roles: Contact PI, Multiple PI, Co-I, Expert Consultant, Consultant,
#          Project Manager, Administrator, Researcher, Postdoc,
#          Program Officer, Project Scientist

